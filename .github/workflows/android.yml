name: Build Android APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          command: android debug
      - uses: actions/upload-artifact@v4
        with:
          name: elif-apk
          path: ${{ steps.buildozer.outputs.filename }}
