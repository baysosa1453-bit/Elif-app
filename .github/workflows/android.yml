name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0"

      - name: Find and expose AIDL
        run: |
          AIDL=$(find "$ANDROID_SDK_ROOT" -type f -name aidl | head -n 1)
          echo "AIDL found at: $AIDL"
          if [ -z "$AIDL" ]; then
            echo "AIDL could not be found"
            exit 1
          fi
          chmod +x "$AIDL"
          echo "$(dirname "$AIDL")" >> "$GITHUB_PATH"
          echo "AIDL=$AIDL" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elif-apk
          path: bin/*.apk
